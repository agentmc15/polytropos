# docs-site: build + deploy the public MkDocs Material manual to GitHub Pages.
#
# (1) The site publishes at https://agentmc15.github.io/polytropos/ once the repo's
#     Settings -> Pages -> Source is set to "GitHub Actions". That is a manual, one-time
#     step and this workflow genuinely cannot do it: creating a Pages site needs admin
#     permission on the repository, and `administration` is not a scope a workflow's
#     GITHUB_TOKEN can hold — `pages: write` grants the right to DEPLOY, not to configure.
#     actions/configure-pages with `enablement: true` was tried and fails with
#     "Resource not accessible by integration"; it only works where Pages is already on,
#     or with an admin-scoped PAT, which is not worth a stored secret for one click.
# (2) This workflow is the ONLY place besides docs-src/requirements.txt that knows about
#     the mkdocs toolchain — bin/ and tests/ stay stdlib-only (CLAUDE.md invariant).
# (3) EVERY ACTION IS PINNED TO A FULL COMMIT SHA, with the version it was at in a comment.
#     A tag is a mutable pointer: `@v4` runs whatever the tag points at today, so an action
#     that is compromised or simply re-pointed changes what this workflow executes without a
#     commit here. The SHA is the only reference that cannot be moved under us. SECURITY.md
#     carries the two commands that resolve a tag to a SHA and confirm which release it is;
#     they are deliberately NOT repeated here, because this file must stay free of any CLI
#     reference a reader could mistake for a step.
# (4) PERMISSIONS ARE SCOPED TO THE JOB THAT NEEDS THEM. The build job runs the repo's own
#     content through a third-party toolchain and gets `contents: read` and nothing else. The
#     deploy credentials (`pages: write`, `id-token: write` — the latter mints an OIDC token)
#     exist only in the deploy job, which runs no repository code. Granting both to the whole
#     workflow, as this used to, put a Pages-deploy credential and an OIDC token in the same
#     job as `pip install`.
name: docs-site

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege at the top; each job adds only what it needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # `--require-hashes` makes docs-src/requirements.txt binding: every package, including
      # transitives, must match the sha256 recorded there or the install fails.
      - name: Install site toolchain
        run: pip install --require-hashes --no-deps -r docs-src/requirements.txt

      - name: Run docs drift gate
        run: python3 -m unittest discover -s tests -p 'test_docs_*.py' -v

      - name: Build site
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site-build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The only job holding deploy credentials, and it runs no repository code.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
