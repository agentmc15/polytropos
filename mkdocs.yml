site_name: polytropos
site_description: A Claude Code plugin that picks the right model per task, estimates the cost before you run it, and keeps the frontier model reserved for work that actually needs it.
site_url: https://agentmc15.github.io/polytropos/
repo_url: https://github.com/agentmc15/polytropos

docs_dir: docs-site
site_dir: site-build

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details

# --strict only promotes WARNING-level findings, and mkdocs logs unresolved
# heading anchors at INFO by default -- so a broken #anchor silently shipped.
# Raising it to warning makes --strict genuinely validate anchors, not just
# link targets. bin/docs_build.py normalizes GitHub-style doubled hyphens when
# rewriting anchors onto site pages; this catches anything it cannot.
validation:
  links:
    anchors: warn

